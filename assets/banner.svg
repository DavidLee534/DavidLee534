<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Sangho Lee — Backend Developer">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="45%" stop-color="#ECFEFF"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="15%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0F766E" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#99F6E4" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#5EEAD4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A5F3FC" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <rect width="1200" height="360" fill="url(#glow2)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <g opacity="0.7">
    <rect x="860" y="68" width="210" height="128" rx="12" fill="#FFFFFF" stroke="#99F6E4" stroke-width="2"/>
    <rect x="878" y="88" width="72" height="10" rx="3" fill="#0D9488"/>
    <rect x="878" y="110" width="54" height="8" rx="3" fill="#14B8A6" fill-opacity="0.55"/>
    <rect x="878" y="128" width="96" height="8" rx="3" fill="#67E8F9" fill-opacity="0.8"/>
    <rect x="878" y="146" width="40" height="8" rx="3" fill="#F59E0B" fill-opacity="0.75"/>
    <circle cx="1038" cy="93" r="5" fill="#10B981"/>
    <circle cx="1056" cy="93" r="5" fill="#F59E0B"/>
    <circle cx="1074" cy="93" r="5" fill="#F43F5E"/>
  </g>

  <g opacity="0.55">
    <rect x="780" y="168" width="150" height="92" rx="12" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="2"/>
    <rect x="798" y="188" width="60" height="8" rx="3" fill="#0F172A" fill-opacity="0.35"/>
    <rect x="798" y="206" width="88" height="8" rx="3" fill="#0F172A" fill-opacity="0.22"/>
    <rect x="798" y="224" width="48" height="8" rx="3" fill="#0D9488" fill-opacity="0.7"/>
  </g>

  <path d="M0 268 C 180 228, 360 308, 560 268 S 920 220, 1200 260 L 1200 360 L 0 360 Z" fill="url(#wave)"/>
  <path d="M0 286 C 220 246, 420 320, 640 286 S 980 236, 1200 276" fill="none" stroke="#0F766E" stroke-opacity="0.25" stroke-width="2"/>

  <g fill="#0F766E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" opacity="0.45">
    <text x="64" y="72">{'{ service: "ready" }'}</text>
    <text x="64" y="96">GET /health  200</text>
    <text x="64" y="120">jpa.fetchJoin()</text>
  </g>

  <text x="600" y="148" text-anchor="middle" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="3">SANGHO LEE</text>
  <text x="600" y="198" text-anchor="middle" fill="#0F766E" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="2">BACKEND DEVELOPER  ·  JAVA &amp; SPRING</text>
</svg>
