<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Sangho Lee — Backend Developer">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="42%" stop-color="#0B1F2A"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="18%" r="42%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#14B8A6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="18%" cy="78%" r="38%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E2E8F0" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#14B8A6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#99F6E4" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>
  <rect width="1200" height="360" fill="url(#glow2)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <rect width="1200" height="360" fill="url(#scan)"/>

  <!-- abstract server/rack blocks -->
  <g opacity="0.55">
    <rect x="860" y="68" width="210" height="128" rx="10" fill="#022C22" stroke="#5EEAD4" stroke-opacity="0.35"/>
    <rect x="878" y="88" width="72" height="10" rx="3" fill="#5EEAD4" fill-opacity="0.85"/>
    <rect x="878" y="110" width="54" height="8" rx="3" fill="#99F6E4" fill-opacity="0.45"/>
    <rect x="878" y="128" width="96" height="8" rx="3" fill="#99F6E4" fill-opacity="0.35"/>
    <rect x="878" y="146" width="40" height="8" rx="3" fill="#F59E0B" fill-opacity="0.7"/>
    <circle cx="1038" cy="93" r="5" fill="#34D399"/>
    <circle cx="1056" cy="93" r="5" fill="#FBBF24"/>
    <circle cx="1074" cy="93" r="5" fill="#FB7185"/>
  </g>

  <g opacity="0.4">
    <rect x="780" y="168" width="150" height="92" rx="10" fill="#0B1220" stroke="#94A3B8" stroke-opacity="0.25"/>
    <rect x="798" y="188" width="60" height="8" rx="3" fill="#E2E8F0" fill-opacity="0.45"/>
    <rect x="798" y="206" width="88" height="8" rx="3" fill="#E2E8F0" fill-opacity="0.28"/>
    <rect x="798" y="224" width="48" height="8" rx="3" fill="#2DD4BF" fill-opacity="0.55"/>
  </g>

  <!-- soft wave base -->
  <path d="M0 268 C 180 228, 360 308, 560 268 S 920 220, 1200 260 L 1200 360 L 0 360 Z" fill="url(#wave)"/>
  <path d="M0 286 C 220 246, 420 320, 640 286 S 980 236, 1200 276" fill="none" stroke="#ECFDF5" stroke-opacity="0.35" stroke-width="2"/>

  <!-- code-like accents -->
  <g fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" opacity="0.28">
    <text x="64" y="72">{`{ service: "ready" }`}</text>
    <text x="64" y="96">{`GET /health  200`}</text>
    <text x="64" y="120">{`jpa.fetchJoin()`}</text>
  </g>

  <text x="600" y="148" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="700" letter-spacing="3">SANGHO LEE</text>
  <text x="600" y="198" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" letter-spacing="2">BACKEND DEVELOPER  ·  JAVA &amp; SPRING</text>
</svg>
